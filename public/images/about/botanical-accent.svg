<svg width="480" height="600" viewBox="0 0 480 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Realistic Wood Stem Gradient -->
    <linearGradient id="twigGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4237" />
      <stop offset="50%" stop-color="#383127" />
      <stop offset="100%" stop-color="#2c261e" />
    </linearGradient>

    <!-- Olive Leaf Gradients (Sunlit & Midtone) -->
    <linearGradient id="oliveFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ab897" />
      <stop offset="45%" stop-color="#648364" />
      <stop offset="100%" stop-color="#3d563d" />
    </linearGradient>

    <linearGradient id="oliveLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bad1b7" />
      <stop offset="50%" stop-color="#809f7e" />
      <stop offset="100%" stop-color="#4e6d4c" />
    </linearGradient>

    <linearGradient id="oliveBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#657e62" />
      <stop offset="100%" stop-color="#2d3f2c" />
    </linearGradient>

    <!-- Depth of Field Blur Filters -->
    <filter id="bokehSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" />
    </filter>
    <filter id="bokehSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" />
    </filter>
    <filter id="leafShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#1b2e1d" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- LAYER 1: Deep Background Leaves (Out of focus, soft bokeh) -->
  <g filter="url(#bokehSoft)" opacity="0.38">
    <path d="M 440 40 C 390 10, 320 20, 280 60 C 270 90, 310 110, 360 100 C 410 90, 435 65, 440 40 Z" fill="url(#oliveBack)" />
    <path d="M 400 120 C 340 105, 270 130, 245 170 C 240 205, 280 225, 335 210 C 390 195, 410 150, 400 120 Z" fill="url(#oliveBack)" />
    <path d="M 320 210 C 260 190, 190 220, 170 265 C 165 300, 210 325, 265 310 C 320 295, 335 245, 320 210 Z" fill="url(#oliveBack)" />
    <path d="M 270 320 C 210 310, 140 340, 120 390 C 115 425, 160 450, 215 435 C 270 420, 285 365, 270 320 Z" fill="url(#oliveBack)" />
  </g>

  <!-- LAYER 2: Midground Stems & Leaves -->
  <g filter="url(#bokehSubtle)" opacity="0.65">
    <path d="M 480 30 Q 360 120 280 240 Q 200 360 130 480" stroke="url(#twigGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <!-- Secondary side branches -->
    <path d="M 360 120 Q 300 130 250 155" stroke="url(#twigGrad)" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <path d="M 280 240 Q 220 265 175 300" stroke="url(#twigGrad)" stroke-width="1.3" stroke-linecap="round" fill="none" />

    <!-- Midground Leaves -->
    <path d="M 360 80 C 315 55, 255 70, 230 105 C 225 130, 260 150, 305 140 C 350 130, 365 105, 360 80 Z" fill="url(#oliveBack)" />
    <path d="M 310 160 C 260 140, 195 165, 175 205 C 170 235, 210 255, 260 240 C 310 225, 325 185, 310 160 Z" fill="url(#oliveFront)" />
    <path d="M 240 270 C 185 260, 125 285, 105 330 C 100 360, 140 385, 195 370 C 250 355, 260 305, 240 270 Z" fill="url(#oliveLight)" />
  </g>

  <!-- LAYER 3: Main Foreground Branch & Detailed Crisp Leaves -->
  <g filter="url(#leafShadow)">
    <!-- Main graceful stem curving down from top right -->
    <path d="M 490 0 C 450 90, 390 190, 310 300 C 240 400, 150 490 40 570" stroke="url(#twigGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Primary branch forks -->
    <path d="M 420 75 C 370 100, 320 115, 270 125" stroke="url(#twigGrad)" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 360 180 C 310 215, 250 235, 190 250" stroke="url(#twigGrad)" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M 290 320 C 240 365, 180 395, 120 420" stroke="url(#twigGrad)" stroke-width="1.6" stroke-linecap="round" fill="none" />
    <path d="M 190 440 C 150 480, 100 510, 50 535" stroke="url(#twigGrad)" stroke-width="1.4" stroke-linecap="round" fill="none" />

    <!-- Leaf 1: Top sunlit olive leaf -->
    <g>
      <path d="M 440 50 C 395 30, 335 45, 305 85 C 300 115, 340 135, 390 125 C 440 115, 455 80, 440 50 Z" fill="url(#oliveLight)" />
      <path d="M 440 50 C 390 80, 335 95, 305 85" stroke="#e2eee0" stroke-width="1" stroke-linecap="round" opacity="0.65" fill="none" />
    </g>

    <!-- Leaf 2: Upper outward leaf -->
    <g>
      <path d="M 455 100 C 485 70, 530 80, 540 120 C 540 155, 500 170, 465 160 C 430 150, 440 115, 455 100 Z" fill="url(#oliveFront)" />
      <path d="M 455 100 C 485 130, 515 140, 540 120" stroke="#d5e5d3" stroke-width="0.9" stroke-linecap="round" opacity="0.5" fill="none" />
    </g>

    <!-- Leaf 3: Branch 1 tip leaf -->
    <g>
      <path d="M 270 125 C 225 110, 165 130, 145 170 C 140 200, 180 220, 225 210 C 270 200, 280 155, 270 125 Z" fill="url(#oliveLight)" />
      <path d="M 270 125 C 220 160, 170 175, 145 170" stroke="#fff" stroke-width="1.1" stroke-linecap="round" opacity="0.6" fill="none" />
    </g>

    <!-- Leaf 4: Sub-branch 1 companion -->
    <g>
      <path d="M 330 135 C 280 135, 230 165, 220 205 C 215 235, 255 250, 295 235 C 335 220, 345 170, 330 135 Z" fill="url(#oliveFront)" />
    </g>

    <!-- Leaf 5: Center focal leaf (Large, elegant curvature) -->
    <g>
      <path d="M 370 200 C 320 185, 255 205, 235 250 C 230 285, 275 310, 330 295 C 385 280, 395 235, 370 200 Z" fill="url(#oliveLight)" />
      <path d="M 370 200 C 315 240, 260 260, 235 250" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.7" fill="none" />
      <!-- Subtle side veins -->
      <path d="M 330 220 C 315 210, 295 215, 285 225" stroke="#e2eee0" stroke-width="0.7" stroke-linecap="round" opacity="0.45" fill="none" />
      <path d="M 305 245 C 290 240, 275 248, 265 260" stroke="#e2eee0" stroke-width="0.7" stroke-linecap="round" opacity="0.45" fill="none" />
    </g>

    <!-- Leaf 6: Branch 2 tip leaf -->
    <g>
      <path d="M 190 250 C 135 240, 75 265, 55 310 C 50 345, 95 370, 150 355 C 205 340, 215 285, 190 250 Z" fill="url(#oliveFront)" />
      <path d="M 190 250 C 135 290, 80 310, 55 310" stroke="#d5e5d3" stroke-width="1.1" stroke-linecap="round" opacity="0.6" fill="none" />
    </g>

    <!-- Leaf 7: Mid-stem leaf -->
    <g>
      <path d="M 310 290 C 355 275, 410 295, 415 335 C 415 365, 375 385, 335 375 C 295 360, 290 315, 310 290 Z" fill="url(#oliveFront)" />
    </g>

    <!-- Leaf 8: Branch 3 main leaf -->
    <g>
      <path d="M 260 350 C 205 345, 145 375, 130 420 C 125 455, 170 475, 220 460 C 270 445, 280 390, 260 350 Z" fill="url(#oliveLight)" />
      <path d="M 260 350 C 205 395, 155 415, 130 420" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.65" fill="none" />
    </g>

    <!-- Leaf 9: Branch 3 tip leaf -->
    <g>
      <path d="M 120 420 C 70 415, 15 445, 0 490 C -5 525, 40 545, 90 530 C 140 515, 145 460, 120 420 Z" fill="url(#oliveFront)" />
      <path d="M 120 420 C 70 465, 25 485, 0 490" stroke="#d5e5d3" stroke-width="1" stroke-linecap="round" opacity="0.5" fill="none" />
    </g>

    <!-- Leaf 10: Hanging branch bottom leaf -->
    <g>
      <path d="M 160 460 C 110 475, 65 520, 60 560 C 60 585, 95 600, 135 585 C 175 570, 185 505, 160 460 Z" fill="url(#oliveLight)" />
      <path d="M 160 460 C 120 510, 85 540, 60 560" stroke="#e2eee0" stroke-width="0.9" stroke-linecap="round" opacity="0.6" fill="none" />
    </g>

    <!-- Leaf 11: Stem terminal leaf -->
    <g>
      <path d="M 40 570 C 5 575, -25 605, -20 635 C -15 655, 15 660, 45 640 C 75 620, 70 585, 40 570 Z" fill="url(#oliveFront)" />
    </g>
  </g>
</svg>
